<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peta Dakwah Nisa 1446-1447 H</title>
<link rel="icon" type="image/png" href="/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --ink:#1E2A2B;
    --paper:#F3F1E9;
    --panel:#FFFFFF;
    --line:#DDD8C8;
    --teal-900:#0B3B3C;
    --teal-800:#124A4B;
    --teal-700:#1A5C5D;
    --gold:#C8992A;
    --gold-dark:#9C7419;
    --muted:#6B7472;
    --shadow: 0 12px 32px -12px rgba(11,59,60,0.35);
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--paper);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  ::selection{ background:var(--gold); color:#fff; }

  /* ---------- HEADER ---------- */
  header.app-header{
    background:linear-gradient(135deg,var(--teal-900) 0%, var(--teal-800) 55%, var(--teal-700) 100%);
    color:#F4EFDC;
    padding:14px 24px 12px;
    box-shadow:var(--shadow);
    z-index:1200;
    position:relative;
    flex:0 0 auto;
  }
  header.app-header::after{
    content:"";
    position:absolute; left:0; right:0; bottom:0;
    height:3px;
    background:linear-gradient(90deg,var(--gold) 0%, #E8C871 50%, var(--gold) 100%);
  }
  .header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{
    width:42px;height:42px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #E8C871, var(--gold) 55%, var(--gold-dark) 100%);
    display:flex;align-items:center;justify-content:center;
    font-family:'Poppins',sans-serif; font-weight:800; color:var(--teal-900); font-size:16px;
    flex-shrink:0;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.35);
  }
  .brand-text h1{
    font-family:'Poppins',sans-serif;
    font-size:19px;
    font-weight:700;
    margin:0;
    letter-spacing:.2px;
    line-height:1.15;
  }
  .brand-text p{
    margin:2px 0 0;
    font-size:12px;
    color:#BFD3CE;
    font-weight:500;
    letter-spacing:.3px;
  }

  .nav-controls{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .menu-toggle{
    display:flex;
    background:rgba(0,0,0,0.22);
    border-radius:999px;
    padding:4px;
    gap:2px;
  }
  .menu-toggle button{
    border:none;
    background:transparent;
    color:#CFE0DB;
    font-family:'Poppins',sans-serif;
    font-weight:600;
    font-size:13px;
    padding:8px 20px;
    border-radius:999px;
    cursor:pointer;
    transition:.18s ease;
    letter-spacing:.3px;
  }
  .menu-toggle button:hover{ color:#fff; }
  .menu-toggle button.active{
    background:var(--gold);
    color:#28210A;
    box-shadow:0 3px 10px -2px rgba(0,0,0,.4);
  }

  .cat-select-wrap{
    position:relative;
    display:flex;
    align-items:center;
  }
  .cat-select-wrap::before{
    content:"Kategori";
    position:absolute;
    top:-16px; left:2px;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.8px;
    color:#9FC2BB;
    font-weight:600;
  }
  select#categorySelect{
    appearance:none;
    -webkit-appearance:none;
    background:#F4EFDC;
    color:var(--teal-900);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    border:none;
    border-radius:8px;
    padding:9px 34px 9px 14px;
    cursor:pointer;
    min-width:250px;
    box-shadow:0 2px 6px rgba(0,0,0,0.25);
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%230B3B3C" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>');
    background-repeat:no-repeat;
    background-position:right 10px center;
    background-size:14px;
  }
  select#categorySelect:focus-visible, .menu-toggle button:focus-visible{
    outline:2px solid #fff;
    outline-offset:2px;
  }

  .header-sub{
    margin-top:10px;
    font-size:12.5px;
    color:#A9C6BF;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .header-sub b{ color:#F4EFDC; }
  .dot-sep{ width:4px;height:4px;border-radius:50%;background:#5C807A; display:inline-block; }

  /* ---------- MAIN LAYOUT ---------- */
  main{
    flex:1 1 auto;
    position:relative;
    min-height:0;
  }
  #map{
    position:absolute;
    inset:0;
    background:#E7E2D2;
  }
  .leaflet-container{ font-family:'Inter',sans-serif; }

  /* legend / hint chip */
  .map-hint{
    position:absolute;
    top:14px; left:14px;
    z-index:600;
    background:rgba(255,255,255,0.92);
    backdrop-filter:blur(4px);
    border:1px solid var(--line);
    border-radius:999px;
    padding:8px 16px;
    font-size:12.5px;
    font-weight:600;
    color:var(--teal-900);
    box-shadow:0 6px 18px -6px rgba(0,0,0,0.25);
    display:flex; align-items:center; gap:8px;
  }
  .map-hint .pulse{
    width:9px;height:9px;border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 0 rgba(200,153,42,0.55);
    animation:pulse 2.2s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(200,153,42,0.55);}
    70%{ box-shadow:0 0 0 10px rgba(200,153,42,0);}
    100%{ box-shadow:0 0 0 0 rgba(200,153,42,0);}
  }

  /* national summary card */
  #summaryCard{
    position:absolute;
    top:14px; right:14px;
    z-index:600;
    background:rgba(255,255,255,0.96);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:0 10px 26px -10px rgba(0,0,0,0.3);
    padding:14px 16px;
    width:230px;
    max-height:70vh;
    overflow-y:auto;
  }
  #summaryCard h3{
    margin:0 0 8px;
    font-family:'Poppins',sans-serif;
    font-size:12.5px;
    text-transform:uppercase;
    letter-spacing:.6px;
    color:var(--teal-800);
    border-bottom:2px solid var(--gold);
    padding-bottom:6px;
  }
  .sum-row{
    display:flex; justify-content:space-between; gap:10px;
    font-size:12.5px;
    padding:5px 0;
    border-bottom:1px dashed var(--line);
  }
  .sum-row:last-child{ border-bottom:none; }
  .sum-row span:first-child{ color:var(--muted); font-weight:500; }
  .sum-row span:last-child{ font-weight:700; color:var(--teal-900); font-variant-numeric:tabular-nums; }

  /* ---------- TOOLTIP PANEL (popup mengambang di sekitar titik klik) ---------- */
  #detailPanel{
    position:absolute;
    top:0; left:0;
    z-index:900;
    background:rgba(255,255,255,0.98);
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow:0 14px 34px -10px rgba(11,59,60,0.45), 0 6px 16px -6px rgba(0,0,0,0.25);
    width:min(360px, 88vw);
    max-height:min(320px, 62vh);
    display:none;
    flex-direction:column;
    overflow:hidden;
    opacity:0;
    transform:scale(0.96);
    transition:opacity .12s ease, transform .12s ease;
  }
  #detailPanel.open{ display:flex; opacity:1; transform:scale(1); }
  .detail-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 12px;
    background:linear-gradient(90deg,var(--teal-900),var(--teal-700));
    color:#fff;
    flex:0 0 auto;
  }
  .detail-head-left{ display:flex; flex-direction:column; gap:1px; min-width:0; }
  .detail-head-left .prov-name{
    font-family:'Poppins',sans-serif;
    font-weight:700;
    font-size:13.5px;
    letter-spacing:.2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .detail-head-left .cat-name{
    font-size:10px;
    color:#DCC97E;
    font-weight:600;
    letter-spacing:.3px;
    text-transform:uppercase;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #detailPanel .closeBtn{
    background:rgba(255,255,255,0.14);
    border:none;
    color:#fff;
    width:24px;height:24px;
    border-radius:50%;
    font-size:14px;
    line-height:1;
    cursor:pointer;
    transition:.15s;
    flex-shrink:0;
    margin-left:8px;
  }
  #detailPanel .closeBtn:hover{ background:rgba(255,255,255,0.3); }

  .cards-scroll{
    flex:1 1 auto;
    display:flex;
    flex-direction:row;
    gap:10px;
    overflow-x:auto;
    overflow-y:auto;
    padding:10px 12px;
  }
  .cards-scroll::-webkit-scrollbar{ height:7px; }
  .cards-scroll::-webkit-scrollbar-thumb{ background:var(--line); border-radius:6px; }
  .cards-scroll::-webkit-scrollbar-track{ background:transparent; }

  .subcard{
    flex:0 0 auto;
    min-width:150px;
    border:1.5px solid var(--line);
    border-radius:9px;
    background:#FCFBF6;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .subcard-head{
    background:var(--teal-900);
    color:#F4EFDC;
    font-family:'Poppins',sans-serif;
    font-weight:700;
    font-size:11px;
    letter-spacing:.3px;
    padding:6px 10px;
    text-align:center;
    border-bottom:2px solid var(--gold);
  }
  .subcard-mahaly{
    font-size:9.5px;
    color:var(--muted);
    text-align:center;
    padding:5px 8px 0;
    font-weight:600;
  }
  .subcard-body{ padding:6px 10px 8px; }
  .field-row{
    display:flex; justify-content:space-between; align-items:baseline;
    gap:8px;
    padding:4px 0;
    border-bottom:1px dashed var(--line);
    font-size:11px;
  }
  .field-row:last-child{ border-bottom:none; }
  .field-row .lbl{ color:var(--muted); font-weight:500; }
  .field-row .val{ font-weight:700; color:var(--teal-900); font-variant-numeric:tabular-nums; white-space:nowrap; }

  .empty-msg{
    padding:20px; text-align:center; color:var(--muted); font-size:12.5px; width:100%;
  }

  /* leaflet tweak */
  .leaflet-tooltip.province-label{
    background:rgba(11,59,60,0.88);
    color:#fff;
    border:none;
    font-family:'Poppins',sans-serif;
    font-weight:600;
    font-size:11px;
    padding:3px 8px;
    border-radius:6px;
    box-shadow:0 4px 10px rgba(0,0,0,0.25);
  }
  .leaflet-tooltip.province-label::before{ display:none; }

  @media (max-width:720px){
    .header-top{ flex-direction:column; align-items:flex-start; }
    select#categorySelect{ min-width:0; width:100%; }
    #summaryCard{ display:none; }
    .subcard{ min-width:160px; }
  }
</style>
</head>

<header class="app-header">
  <div class="header-top">
    <div class="brand">
      <div class="brand-mark">ED</div>
      <div class="brand-text">
        <h1>EVALUASI DAKWAH NISA 1446-1447 H</h1>

      </div>
      <div class="cat-select-wrap">

  <div class="header-sub">

</header>

<main>

  <div id="summaryCard">

  </div>

  <div id="detailPanel">

</main>

/* ---------- Util warna: menghasilkan warna berbeda & konsisten per provinsi ---------- */
function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  const toHex = x => Math.round(255 * x).toString(16).padStart(2, '0');
  return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
}

const PROVINCE_COLORS = {};
(function buildPalette() {
  const total = PROVINCE_ORDER.length;
  // offset & multiplier dipilih agar provinsi bertetangga tidak mendapat hue yang berdekatan
  const step = 360 / total;
  PROVINCE_ORDER.forEach((name, i) => {
    const hue = (i * step * 2.15) % 360;
    PROVINCE_COLORS[name] = hslToHex(hue, 58, 47);
  });
})();
function colorForProvince(name) {
  return PROVINCE_COLORS[name] || '#9AA6A5';
}

/* ---------- Normalisasi nama provinsi dari properti GeoJSON ---------- */
function normalizeName(s) {
  return (s || '').toString()
    .toUpperCase()
    .replace(/\u00a0/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}
function resolveProvinceName(rawName) {
  const n = normalizeName(rawName);
  if (PROVINCE_ALIASES[n]) return PROVINCE_ALIASES[n];
  // fallback: cocokkan langsung dengan PROVINCE_ORDER (case-insensitive)
  const direct = PROVINCE_ORDER.find(p => normalizeName(p) === n);
  if (direct) return direct;
  // fallback: cocokkan substring
  const partial = PROVINCE_ORDER.find(p => n.includes(normalizeName(p)) || normalizeName(p).includes(n));
  return partial || null;
}
function getFeatureProvinceRaw(props) {
  const candidates = ['Propinsi', 'PROVINSI', 'Provinsi', 'provinsi', 'NAME_1', 'name', 'NAMOBJ', 'WADMPR', 'state', 'province', 'NAMA_PROV', 'nama'];
  for (const key of candidates) {

  return null;
}

      onEachFeature: onEachFeature
    }).addTo(map);
    try { map.fitBounds(geoLayer.getBounds(), { padding: [10, 10] }); } catch (e) {}
    renderMarkers();
    renderSummary();
  })
  .catch(err => {
    console.error('Gagal memuat GeoJSON provinsi:', err);
    document.querySelector('.map-hint').innerHTML =
      '&#9888;&nbsp; Batas provinsi gagal dimuat (periksa koneksi internet). Titik data tetap ditampilkan.';
    renderMarkers();
    renderSummary();
  });

function styleFeature(feature) {
  const raw = getFeatureProvinceRaw(feature.properties);
  const prov = resolveProvinceName(raw);
  return {
    fillColor: prov ? colorForProvince(prov) : '#C9C4B4',
    weight: 1.3,
    color: '#3B3B34',
    fillOpacity: 0.62,
    opacity: 0.85
  };
}

function onEachFeature(feature, layer) {
  const raw = getFeatureProvinceRaw(feature.properties);
  const prov = resolveProvinceName(raw);
  layer.on({
    mouseover: (e) => {
      e.target.setStyle({ fillOpacity: 0.85, weight: 2.4, color: '#0B3B3C' });
      e.target.bringToFront();
    },
    mouseout: (e) => {
      if (!geoLayer) return;
      geoLayer.resetStyle(e.target);
    },
    click: (e) => {
      L.DomEvent.stopPropagation(e);
      suppressNextDocClose = true;
      showDetail(prov || raw, e.containerPoint);
    }
  });
}

/* ---------- Titik lokasi tiap provinsi ---------- */
function renderMarkers() {
  markerLayer.clearLayers();
  const dataset = MENUS[currentMenu].data;
  Object.keys(dataset).forEach(prov => {
    const coord = PROVINCE_COORDS[prov];
    if (!coord) return;

    // Hitbox tak kasat mata: memperbesar area klik di sekitar titik agar mudah
    // diklik walau tampilan batas provinsi (GeoJSON) gagal dimuat dari internet.
    const hit = L.circle(coord, {
      radius: PROVINCE_HIT_RADIUS_M[prov] || 60000,
      stroke: false,
      fillOpacity: 0,
      fillColor: '#000',
      fill: true,
      interactive: true
    });
    hit.on('click', (e) => {
      L.DomEvent.stopPropagation(e);
      suppressNextDocClose = true;
      showDetail(prov, e.containerPoint);
    });
    hit.addTo(markerLayer);

    const marker = L.circleMarker(coord, {
      radius: 7,
      fillColor: '#C8992A',
      color: '#FFFFFF',
      weight: 2,
      fillOpacity: 0.95
    });
    marker.on('click', (e) => {
      L.DomEvent.stopPropagation(e);
      suppressNextDocClose = true;
      showDetail(prov, e.containerPoint);
    });
    marker.addTo(markerLayer);
  });
}

/* ---------- Panel detail (popup mengambang di sekitar titik klik) ---------- */
const mapEl = document.getElementById('map');
const detailPanel = document.getElementById('detailPanel');
const panelProvName = document.getElementById('panelProvName');
const panelCatName = document.getElementById('panelCatName');
const panelCards = document.getElementById('panelCards');

function fmt(v) {
  if (v === null || v === undefined || v === '') return '-';
  if (typeof v === 'number') return v.toLocaleString('id-ID');
  return v;
}

/* Menempatkan panel di sekitar titik klik (containerPoint), lalu menyesuaikan
   posisinya agar selalu berada di dalam area peta (tidak terpotong tepi). */
function positionPanelNear(point) {
  if (!point) return;
  const mapW = mapEl.clientWidth;
  const mapH = mapEl.clientHeight;

  // tampilkan dulu (tak kasat mata) supaya ukurannya bisa diukur
  detailPanel.style.visibility = 'hidden';
  detailPanel.style.left = '0px';
  detailPanel.style.top = '0px';
  detailPanel.classList.add('open');

  const pw = detailPanel.offsetWidth;
  const ph = detailPanel.offsetHeight;
  const margin = 14;

  let left = point.x + 16;
  let top = point.y - ph / 2;

  if (left + pw > mapW - margin) left = point.x - pw - 16;
  if (left < margin) left = margin;
  if (top + ph > mapH - margin) top = mapH - ph - margin;
  if (top < margin) top = margin;

  detailPanel.style.left = left + 'px';
  detailPanel.style.top = top + 'px';
  detailPanel.style.visibility = 'visible';
}

function showDetail(provinceName, point) {
  if (!provinceName) return;
  activeProvince = provinceName;
  lastClickPoint = point || lastClickPoint;

  const menuCfg = MENUS[currentMenu];
  const catCfg = menuCfg.categories[currentCategory];
  const records = menuCfg.data[provinceName];

  panelProvName.textContent = provinceName;
  panelCatName.textContent = `${menuCfg.label} \u2014 ${catCfg.label}`;
  panelCards.innerHTML = '';

  if (!records || records.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-msg';
    empty.textContent = `Tidak ada data "${menuCfg.label}" untuk provinsi ${provinceName}.`;
    panelCards.appendChild(empty);
  } else {
    records.forEach(rec => {
      const card = document.createElement('div');
      card.className = 'subcard';

      const head = document.createElement('div');
      head.className = 'subcard-head';
      head.textContent = rec.name;
      card.appendChild(head);

      if (rec.jumlah_mahaly !== undefined) {
        const mahaly = document.createElement('div');
        mahaly.className = 'subcard-mahaly';
        mahaly.textContent = `Jumlah Mahally: ${fmt(rec.jumlah_mahaly)}`;
        card.appendChild(mahaly);
      }

      const body = document.createElement('div');
      body.className = 'subcard-body';
      catCfg.fields.forEach(f => {
        const row = document.createElement('div');
        row.className = 'field-row';
        row.innerHTML = `<span class="lbl">${f.label}</span><span class="val">${fmt(rec[f.key])}</span>`;
        body.appendChild(row);
      });
      card.appendChild(body);
      panelCards.appendChild(card);
    });
  }

  positionPanelNear(lastClickPoint);
}

function closePanel() {
  detailPanel.classList.remove('open');
  activeProvince = null;
  lastClickPoint = null;
}

let lastClickPoint = null;
let suppressNextDocClose = false;

document.getElementById('panelClose').addEventListener('click', (e) => {
  e.stopPropagation();
  closePanel();
});

/* Klik di sembarang tempat di luar panel akan menutup tooltip.
   suppressNextDocClose menjaga agar klik yang BARU SAJA membuka panel
   (dari titik/wilayah provinsi) tidak langsung menutupnya lagi pada tick yang sama. */
document.addEventListener('click', (evt) => {
  if (suppressNextDocClose) { suppressNextDocClose = false; return; }
  if (detailPanel.classList.contains('open') && !detailPanel.contains(evt.target)) {
    closePanel();
  }
});

/* ---------- Ringkasan nasional (total seluruh provinsi utk kategori aktif) ---------- */
function renderSummary() {
  const menuCfg = MENUS[currentMenu];
  const catCfg = menuCfg.categories[currentCategory];
  const dataset = menuCfg.data;

  const totals = {};
  catCfg.fields.forEach(f => totals[f.key] = 0);
  let provCount = 0;
  Object.values(dataset).forEach(records => {
    provCount++;
    records.forEach(rec => {
      catCfg.fields.forEach(f => { totals[f.key] += (Number(rec[f.key]) || 0); });
    });
  });

  document.getElementById('summaryTitle').textContent = `Ringkasan Nasional \u2014 ${catCfg.label}`;
  const body = document.getElementById('summaryBody');
  body.innerHTML = '';
  catCfg.fields.forEach(f => {
    const row = document.createElement('div');
    row.className = 'sum-row';
    row.innerHTML = `<span>${f.label}</span><span>${fmt(totals[f.key])}</span>`;
    body.appendChild(row);
  });

  document.getElementById('activeMenuLabel').textContent = menuCfg.label;
  document.getElementById('activeCatLabel').textContent = catCfg.label;
  document.getElementById('activeProvCount').textContent = `${provCount} provinsi memiliki data`;
}

/* ---------- Navigasi: menu utama (PJ / Lijan) ---------- */
const btnMenuPJ = document.getElementById('btnMenuPJ');
const btnMenuLijan = document.getElementById('btnMenuLijan');
const categorySelect = document.getElementById('categorySelect');

function populateCategorySelect() {
  const cats = MENUS[currentMenu].categories;
  categorySelect.innerHTML = '';
  Object.keys(cats).forEach(key => {
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = cats[key].label;
    categorySelect.appendChild(opt);
  });
  currentCategory = MENUS[currentMenu].defaultCat;
  categorySelect.value = currentCategory;
}

function setMenu(menuKey) {
  currentMenu = menuKey;
  btnMenuPJ.classList.toggle('active', menuKey === 'PJ');
  btnMenuPJ.setAttribute('aria-selected', menuKey === 'PJ');
  btnMenuLijan.classList.toggle('active', menuKey === 'Lijan');
  btnMenuLijan.setAttribute('aria-selected', menuKey === 'Lijan');
  populateCategorySelect();
  renderMarkers();
  renderSummary();
  if (geoLayer) geoLayer.eachLayer(l => geoLayer.resetStyle(l));
  if (activeProvince && lastClickPoint) {
    showDetail(activeProvince, lastClickPoint);
  } else {
    closePanel();
  }
}

btnMenuPJ.addEventListener('click', (e) => { e.stopPropagation(); setMenu('PJ'); });
btnMenuLijan.addEventListener('click', (e) => { e.stopPropagation(); setMenu('Lijan'); });

categorySelect.addEventListener('change', (e) => {
  e.stopPropagation();
  currentCategory = e.target.value;
  renderSummary();
  if (activeProvince && lastClickPoint) showDetail(activeProvince, lastClickPoint);
});
categorySelect.addEventListener('click', (e) => e.stopPropagation());

/* ---------- Inisialisasi awal ---------- */
populateCategorySelect();

</script>
